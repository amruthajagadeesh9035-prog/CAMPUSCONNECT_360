
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Notifications | CAMPUSCONNECT 360</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #243b64;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            background: #243b64;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #36568a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #243b64;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .message {
            background: #e8f5e9;
            color: #256029;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Notifications</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('send_notification') }}" method="POST">

        <label>Notification Title</label>

        <input
            type="text"
            name="title"
            placeholder="Enter notification title"
            required
        >

        <label>Notification Message</label>

        <textarea
            name="message"
            rows="5"
            placeholder="Enter notification message"
            required
        ></textarea>

        <button type="submit">
            Send Notification
        </button>

    </form>

    <a class="back" href="{{ url_for('admin_dashboard') }}">
        Back to Admin Dashboard
    </a>

</div>

</body>
</html>
